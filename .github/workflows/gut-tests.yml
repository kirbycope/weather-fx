name: GUT Unit Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gut:
    runs-on: ubuntu-latest

    env:
      HOME: /tmp/godot-home
      XDG_CONFIG_HOME: /tmp/godot-home/.config
      XDG_CACHE_HOME: /tmp/godot-home/.cache

    container:
      image: "barichello/godot-ci:4.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:

      - name: Install Godot runtime deps
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends blender libfontconfig1 python3-numpy

      - name: Configure Blender path for headless import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME/godot" "$XDG_CACHE_HOME"
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          EOF

      - name: Put the addon where the demo project expects it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "demo/addons/weather_fx"
          # Anchored: unanchored, 'demo' would also match scenes/demo/, the demo scene itself.
          rsync -a --exclude '/.git' --exclude '/.github' --exclude '/demo' \
                --exclude '/.gitignore' --exclude '/.gitattributes' ./ "demo/addons/weather_fx/"

      - name: Import project
        run: |
          for _ in 1 2 3 4; do
            godot --headless --path "$PWD/demo" --import --quit
          done

      - name: Run Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          mkdir -p test-results
          godot \
            --headless \
            -d \
            --path "$PWD/demo" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://addons/weather_fx/.gutconfig.json \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gexit

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
