name: Demo on Pages

# The addon is what this repository ships, so consuming projects take it as a submodule and clone
# everything on this branch. A web export is tens of megabytes and git cannot delta a .wasm, so the
# export is built here and handed straight to Pages rather than committed.
#
# Builds on Linux like every other addon here. It used to build on Windows because the Linux
# runner produced a demo with no textures at all, which looked like a texture bug; the real cause
# was an unreferenced Pot.blend, which made Godot fail with "Cannot configure blender path in
# headless mode" and abort the whole import. That file is gone, and a Linux import now produces
# textures byte-identical to the Windows and macOS ones.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          unzip -q templates.tpz
          # The .tpz unpacks to templates/; Godot looks for them under the version's own directory.
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dest"
          mv templates/* "$dest/"

      - name: Install Blender when the project has a .blend
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -name '*.blend' -not -path './.git/*' | grep -q .; then
            echo "No .blend in this repository; Godot will never reach for Blender."
            exit 0
          fi
          echo "Found a .blend; installing Blender."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          # Godot must be told where Blender is. Without this it fails with "Cannot configure blender
          # path in headless mode", and that error aborts the WHOLE import: no fonts, no textures, and
          # an export a tenth of its proper size.
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%%-*}.tres"
          mkdir -p "$(dirname "$settings")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'filesystem/import/blender/blender_path = "/usr/bin/blender"'
          } > "$settings"
          blender --version | head -1

      - name: Export the demo
        run: |
          set -euo pipefail
          mkdir -p build
          # Import repeatedly before exporting. One pass only registers the files; each further pass
          # writes the resources whose dependencies the previous pass produced, and an asset-heavy
          # addon needs several. Exporting early ships scenes whose textures were never written to
          # .godot/imported, which the browser reports as a corrupt texture.
          for _ in 1 2 3 4; do
            godot --headless --path . --import
          done
          godot --headless --path . --export-release "Web" build/index.html

      - name: Upload the export
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
