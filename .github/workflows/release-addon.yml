name: Release Addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          commit_msg="$(git log -1 --pretty=%B || true)"
          commit_author="$(git log -1 --pretty=%an || true)"
          if [[ "$commit_msg" == *"[skip ci]"* ]] || [[ "$commit_author" == *"github-actions"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_tag="$(git tag --points-at HEAD 'v*' | head -n1 || true)"
          if [[ -n "$current_tag" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=${current_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
          if [[ -z "$latest_tag" ]]; then
            release_version="3.0.0"
          else
            base_version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$base_version"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            release_version="$major.$minor.$((patch + 1))"
          fi

          IFS='.' read -r major minor patch <<< "$release_version"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}
          next_dev_version="$major.$minor.$((patch + 1))"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"
          echo "next_dev_version=$next_dev_version" >> "$GITHUB_OUTPUT"
          echo "next_dev_branch=v$next_dev_version" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          rm -rf dist
          mkdir -p dist
          cp -R addons/3d_player_controller dist/3d_player_controller

          (
            cd dist
            zip -r "../3d_player_controller-v${version}.zip" "3d_player_controller"
          )

      - name: Publish GitHub release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: 3d_player_controller-v${{ steps.version.outputs.version }}.zip

      - name: Bump project.godot version and create next branch
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          next_dev_version="${{ steps.version.outputs.next_dev_version }}"
          next_dev_branch="${{ steps.version.outputs.next_dev_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if grep -q '^config/version=' project.godot; then
            sed -i "s|^config/version=.*|config/version=\"$next_dev_version\"|" project.godot
          else
            sed -i "/^\[application\]/a config/version=\"$next_dev_version\"" project.godot
          fi

          git add project.godot
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $next_dev_version [skip ci]"
            git push origin main
          fi

          git branch -f "$next_dev_branch" HEAD
          git push origin "$next_dev_branch"
